<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1B2B" />
    <meta
      name="description"
      content="BacTrack DZ — منصّة مغربية جزائرية لتنظيم مراجعة البكالوريا: تتبّع الامتحانات، مراجعة ذكية بالبطاقات، وتحليلات دقيقة لتقدّمك."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BacTrack DZ — رحلتك إلى البكالوريا، بخطة واضحة</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('bactrack_theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
